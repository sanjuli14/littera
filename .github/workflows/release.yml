name: Release

# Se publica una versión al subir una etiqueta: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publicar ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar versión y novedades
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::La etiqueta v$TAG no coincide con la versión de pubspec.yaml ($PUBSPEC)."
            exit 1
          fi
          tool/release_notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.LITTERA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto LITTERA_KEYSTORE_BASE64: sin él las actualizaciones no se podrían instalar."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/littera-release.jks"

      - name: Compilar APK firmado
        env:
          LITTERA_KEYSTORE_PATH: ${{ runner.temp }}/littera-release.jks
          LITTERA_KEYSTORE_PASSWORD: ${{ secrets.LITTERA_KEYSTORE_PASSWORD }}
          LITTERA_KEY_ALIAS: ${{ secrets.LITTERA_KEY_ALIAS }}
          LITTERA_KEY_PASSWORD: ${{ secrets.LITTERA_KEY_PASSWORD }}
        # Un APK por arquitectura (cada móvil solo descarga la suya) y código
        # ofuscado sin símbolos de depuración: mucho más ligero.
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info="$RUNNER_TEMP/symbols"
          V="${{ steps.version.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          cp "$OUT/app-arm64-v8a-release.apk"   "littera-$V-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "littera-$V-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "littera-$V-x86_64.apk"
          ls -lh littera-*.apk

      - name: Crear la Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        # arm64 va primero: es el que toman la web y las versiones antiguas
        # de la app, que eligen el primer APK de la lista.
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "littera-$V-arm64-v8a.apk" \
            --title "Littera $V" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" "littera-$V-armeabi-v7a.apk"
          gh release upload "$GITHUB_REF_NAME" "littera-$V-x86_64.apk"

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/littera-release.jks"
